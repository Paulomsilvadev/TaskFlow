<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet"> <!--biblioteca de icons-->
    <link rel="stylesheet" href="style.css">
    <title>Login | TaskFlow</title>
</head>
<body>
    <main class="container">
        <img src="../img/TaskFlow Gradient Logo.png" alt="Logo TaskFlow">
        <form>
            <h1>Login TaskFlow</h1>
            <div class ="input-box">
                <input id="email" placeholder="Email" type="email">
                <i class="bx bxs-user"></i> <!--importa o icone de user-->
            </div>
            <div class ="input-box">
                <input id="senha" placeholder="Senha" type="password">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="lembrar-login">
                <label>
                    <input id="lembrar" type="checkbox"> Lembrar Login
                </label>
                <a href="">Esqueci senha</a>
            </div>

            <button type="submit" class="login">Login</button>
        

        <div class="registrar">
            <p>Não tem uma conta? <a href ="../Cadastro/cadastro.html">Cadastre-se</a></p>
            
        </div>

        </form>

    </main>
    <script src="login.js"></script>
</body>
</html>
