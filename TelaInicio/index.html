
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskFlow | Organize seu trabalho</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <header class="header">
        <nav class="navbar">
           <img src="../img/TaskFlow Gradient Logo.png" alt="Logo do TaskFlow" class="logo">
        
            <div class="nav-buttons">
               <a href="../Login/login.html" class="login" id="btnLogin">Entrar</a>
                <a href="../Cadastro/cadastro.html" class="btn-small">Cadastrar</a>
            </div>
        </nav>
    </header>

    <main class="hero">

        <section class="hero-content">

            <h1>
                Organize seu trabalho
                <br>
                como <span>nunca antes</span>
            </h1>

            <p>
                Transforme sua produtividade com o TaskFlow.
                Organize suas tarefas, acompanhe seu progresso
                e mantenha tudo em um só lugar.
            </p>

            <div class="hero-buttons">
                <a href="../Cadastro/cadastro.html" class="btn-primary">
                    Começar gratuitamente →
                </a>

            
            </div>

            <div class="social-proof">
                <div class="avatars">
                    <span>L</span>
                    <span>A</span>
                    <span>M</span>
                    <span>J</span>
                </div>

                <small>Organize melhor seu dia</small>

                <span class="separator">|</span>

                <small>★★★★★ 5.0</small>
            </div>

        </section>

        <section class="hero-image">

            <div class="task-card">
                <div class="task-header">
                    <div class="task-icon"></div>

                    <div class="skeleton">
                        <div class="line large"></div>
                        <div class="line small"></div>
                    </div>
                </div>

                <div class="task-item">
                    <div class="line large"></div>
                    <div class="line small"></div>
                </div>

                <div class="task-item">
                    <div class="line large"></div>
                    <div class="line small"></div>
                </div>

                <div class="task-item">
                    <div class="line large"></div>
                    <div class="line small"></div>
                </div>
            </div>

            <div class="processing">
                <span>●</span> TaskFlow ativo
                <div class="progress">
                    <div></div>
                </div>
            </div>

        </section>

    </main>

    <script src="./inicio.js"></script>

</body>
</html>
