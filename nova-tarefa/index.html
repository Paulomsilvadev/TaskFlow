<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Tarefa | TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="../img/TaskFlow Gradient Logo.png" alt="Logo TaskFlow">

        <nav>
            <a href="../TelaInicio/index.html">Início</a>
            <a href="./index.html">Nova Tarefa</a>
            <a href="../Tarefas/Tarefas.html">Tarefas</a>
            <a href="../TelaUsuario/TelaUsuario.html">Perfil</a>
        </nav>
    </header>

    <main>
        <h2>Nova Tarefa</h2>
        <p>Organize suas atividades e não esqueça seus compromissos.</p>

        <form id="formTarefas">
            <label for="nomeTarefa">Nome da tarefa:</label>
            <input
                type="text"
                id="nomeTarefa"
                placeholder="Nome da Tarefa"
                required
            >

            <label for="descricaoTarefa">Descrição da Tarefa:</label>
            <textarea
                id="descricaoTarefa"
                rows="4"
                placeholder="Descreva os detalhes da tarefa..."
                required
                ></textarea>

            <label for="dataInicio">Data de Início:</label>
            <input
                type="date"
                id="dataInicio"
                required
            >

            <label for="dataConclusao">Data de conclusão:</label>
            <input
                type="date"
                id="dataConclusao"
                required
            >

            <button type="submit"  class="cadastroNovaTarefa">Cadastrar tarefa</button>
        </form>

        <p id="mensagem"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
