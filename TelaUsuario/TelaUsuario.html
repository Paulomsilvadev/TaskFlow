<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário | TaskFlow</title>
    <link rel="stylesheet" href="./TelaUsuario.css">
</head>
<body>
    <header>
        <img src="../img/TaskFlow Gradient Logo.png" alt="Logo do TaskFlow">

        <nav>
            <a href="../TelaInicio/index.html">Início</a>
            <a href="../nova-tarefa/index.html">Nova Tarefa</a>
            <a href="../Tarefas/Tarefas.html">Tarefas</a>
            <a href="../TelaUsuario/TelaUsuario.html">Perfil</a>
        </nav>
    </header>

    <main>
        <section class="perfil-card">
            <h2>Meu Perfil</h2>

            <div class="avatar" id="avatarInicial">
                U
            </div>

            <div class="perfil-info">
                <div>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu email">
                </div>
            </div>

            <div class="perfil-acoes">
                <button type="button" class="btn-editar" id="btnSalvar">
                    Salvar alterações
                </button>
                
                <button type="button" class="btn-sair" id="btnSair">
                    Sair da conta
                </button>
            </div>
        </section>
    </main>
    <script src="./TelaUsuario.js"></script>
</body>
</html>
