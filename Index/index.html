
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Tarefa | TaskFlow</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>TaskFlow</h1>

        <nav>
            <a href="../index.html">Início</a>
            <a href="../nova-tarefa/index.html">Nova Tarefa</a>
            <a href="../tarefas/index.html">Tarefas</a>
            <a href="../perfil/index.html">Perfil</a>
        </nav>
    </header>

    <main>
        <h2>Nova Tarefa</h2>

        <p>Organize suas atividades e não esqueça seus compromissos.</p>

        <form id="formTarefas">

            <label for="nomeTarefa">Nome da tarefa:</label>

            <input
                type="text"
                id="nomeTarefa"
                placeholder="Estudante"
                required
            >

            <label for="dataTarefa">Data de conclusão:</label>

            <input
                type="date"
                id="dataTarefa"
                required
            >

            <button type="submit">Cadastrar tarefa</button>

        </form>

        <p id="mensagem"></p>

    </main>

    <script src="script.js"></script>

</body>
</html>
