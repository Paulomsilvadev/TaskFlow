
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Tarefa | TaskFlow</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="../img/TaskFlow Gradient Logo.png" alt="Logo do TaskFlow">

        <nav>
            <a href="./index.html">Início</a>
            <a href="../Tarefas/Tarefas.html">Tarefas</a>
            <a href="../TelaUsuario/TelaUsuario.html">Perfil</a>
        </nav>
    </header>

    <main>
        <h2>Nova Tarefa</h2>

        <p>Organize suas atividades e não esqueça seus compromissos.</p>

        <form id="formTarefa">

            <label for="nomeTarefa">Nome da tarefa:</label>

            <input
                type="text"
                id="nomeTarefa"
                placeholder="Estudante"
                required
            >

            <label for="dataTarefa">Data de conclusão:</label>

            <input
                type="date"
                id="dataTarefa"
                required
            >

            <button type="submit">Cadastrar tarefa</button>

        </form>

        <p id="mensagem"></p>

    </main>
    <script src="../Dados.js"></script>
    <script src="./script.js"></script>

</body>
</html>
